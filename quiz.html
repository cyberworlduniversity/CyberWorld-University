<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Take Quiz | CWU</title><link rel="stylesheet" href="css/style.css"></head><body><main><div class="container" style="padding:40px 0" id="app">Loading...</div></main><script type="module">import "./js/firebase.js";const id=new URLSearchParams(location.search).get("id"),app=document.getElementById("app"),esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));async function load(){try{const u=await window.CWU.currentUser();if(!u){location.href="login.html";return}const q=(await window.CWU.quiz(id)).quiz;app.innerHTML='<h1>'+esc(q.title)+'</h1><form id="f">'+q.questions.map((x,i)=>'<div class="card" style="margin:16px 0"><div class="card-body"><h3>'+(i+1)+'. '+esc(x.question)+'</h3>'+(x.options||[]).map((o,j)=>'<label style="display:block;margin:8px"><input type="radio" name="'+x.id+'" value="'+j+'"> '+esc(o)+'</label>').join("")+'</div></div>').join("")+'<button class="btn btn-primary">Submit Quiz</button></form>';document.getElementById("f").onsubmit=async e=>{e.preventDefault();const a={};q.questions.forEach(x=>{const z=document.querySelector("input[name='"+x.id+"']:checked");if(z)a[x.id]=+z.value});const r=await window.CWU.submitQuiz(id,a);app.innerHTML='<div class="card"><div class="card-body"><h1>'+r.score+'%</h1><p>'+r.earnedPoints+'/'+r.totalPoints+' points — '+(r.passed?"Passed":"Not passed")+'</p><a class="btn btn-primary" href="quizzes.html">Back</a></div></div>'}}catch(e){app.innerHTML='<div class="card"><div class="card-body"><h2>Unable to load quiz</h2><p>'+esc(e.message)+'</p></div></div>'}}load();</script></body></html>
