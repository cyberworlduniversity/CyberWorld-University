<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Take Quiz | CWU</title><link rel="stylesheet" href="css/style.css"></head><body><main><div class="container" style="padding:40px 0" id="app">Loading...</div></main><script type="module">import "./js/firebase.js";const id=new URLSearchParams(location.search).get("id"),app=document.getElementById("app"),esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));let timerId=null,submitted=false;function formatTime(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}async function load(){try{const u=await window.CWU.currentUser();if(!u){location.href="login.html";return}const q=(await window.CWU.quiz(id)).quiz;const started=Date.parse(q.serverStartedAt);const end=started+(Number(q.durationSeconds)||Number(q.durationMinutes||10)*60)*1000;app.innerHTML='<div class="card"><div class="card-body"><div style="display:flex;justify-content:space-between;gap:16px;align-items:center"><h1>'+esc(q.title)+'</h1><strong id="timer" aria-live="polite">--:--</strong></div><p>Time limit: '+esc(q.durationMinutes||10)+' minutes</p></div></div><form id="f">'+q.questions.map((x,i)=>'<div class="card" style="margin:16px 0"><div class="card-body"><h3>'+(i+1)+'. '+esc(x.question)+'</h3>'+(x.options||[]).map((o,j)=>'<label style="display:block;margin:8px"><input type="radio" name="'+x.id+'" value="'+j+'"> '+esc(o)+'</label>').join("")+'</div></div>').join("")+'<button class="btn btn-primary" id="submitBtn">Submit Quiz</button></form>';const timer=document.getElementById("timer"),form=document.getElementById("f"),submit=async()=>{if(submitted)return;submitted=true;clearInterval(timerId);const a={};q.questions.forEach(x=>{const z=document.querySelector("input[name='"+x.id+"']:checked");if(z)a[x.id]=+z.value});try{const r=await window.CWU.submitQuiz(id,a);app.innerHTML='<div class="card"><div class="card-body"><h1>'+r.score+'%</h1><p>'+r.earnedPoints+'/'+r.totalPoints+' points — '+(r.passed?"Passed":"Not passed")+'</p><a class="btn btn-primary" href="quizzes.html">Back</a></div></div>'}catch(e){app.innerHTML='<div class="card"><div class="card-body"><h2>Quiz not submitted</h2><p>'+esc(e.message)+'</p><a class="btn btn-primary" href="quizzes.html">Back</a></div></div>'}};const tick=()=>{const left=Math.ceil((end-Date.now())/1000);timer.textContent=formatTime(left);if(left<=0){clearInterval(timerId);submit()}};form.onsubmit=e=>{e.preventDefault();submit()};timerId=setInterval(tick,1000);tick()}catch(e){app.innerHTML='<div class="card"><div class="card-body"><h2>Unable to load quiz</h2><p>'+esc(e.message)+'</p></div></div>'}}load();</script></body></html>
