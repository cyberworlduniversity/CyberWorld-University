<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quizzes | CWU</title><link rel="stylesheet" href="css/style.css"></head><body><header class="navbar"><a class="logo" href="index.html"><span class="logo-mark">⌬</span><span><strong>Cyber World</strong><small>University</small></span></a></header><main><div class="container"><section class="page-head"><span class="eyebrow">ASSESSMENT</span><h1>My Quizzes</h1><p>Published quizzes from your enrolled courses.</p></section><div id="list" class="grid"></div></div></main><script type="module">import "./js/firebase.js";const list=document.getElementById("list"),esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));async function load(){try{const u=await window.CWU.currentUser();if(!u){list.innerHTML='<div class="card"><div class="card-body"><a class="btn btn-primary" href="login.html">Login to view quizzes</a></div></div>';return}const qs=await window.CWU.quizzes();list.innerHTML=qs.length?qs.map(q=>'<div class="card"><div class="card-body"><h3>'+esc(q.title)+'</h3><p>'+q.questionCount+' questions · '+q.durationMinutes+' minutes · Passing '+q.passingScore+'%</p><a class="btn btn-green" href="quiz.html?id='+encodeURIComponent(q.id)+'">Start Quiz</a></div></div>').join(""):'<div class="card"><div class="card-body"><p class="muted">No quizzes available.</p></div></div>'}catch(e){list.innerHTML='<div class="card"><div class="card-body"><p>'+esc(e.message)+'</p></div></div>'}}load();</script></body></html>
