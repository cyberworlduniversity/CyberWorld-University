<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courses | CWU Admin</title><link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="navbar"><a class="logo" href="../index.html"><span class="logo-mark">⌬</span><span><strong>Cyber World</strong><small>ADMIN PANEL</small></span></a>
<div class="nav-actions"><a class="btn" href="../index.html">Public Site</a><button class="btn btn-danger" id="logoutBtn">Logout</button></div></header>
<div class="admin-shell">
<aside class="admin-sidebar"><b>ADMINISTRATION</b><a href="index.html">Dashboard</a><a href="courses.html">Courses</a><a href="videos.html">Videos</a><a href="materials.html">Materials</a><a href="questions.html">Question Bank</a><a href="quizzes.html">Quizzes</a><a href="exams.html">Examinations</a><a href="certificates.html">Certificates</a><a href="advertisements.html">Advertisements</a><a href="students.html">Students</a><a href="settings.html">Website Content</a></aside>
<main class="admin-main">
<div class="admin-top"><h1>Course Management</h1><span id="modeLabel">Create Course</span></div>
<form id="courseForm" class="card card-body">
<input type="hidden" name="id">
<div class="form-grid">
<div class="field"><label>Course Name</label><input name="title" class="input" required></div>
<div class="field"><label>Category</label><input name="category" class="input" required></div>
<div class="field"><label>Level</label><select name="level" class="select"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div>
<div class="field"><label>Instructor</label><input name="instructor" class="input" value="CWU Academy"></div>
<div class="field"><label>Duration (minutes)</label><input name="durationMinutes" class="input" type="number" min="0" value="0"></div>
<div class="field"><label>Price</label><input name="price" class="input" value="Free"></div>
<div class="field"><label>Thumbnail URL</label><input name="thumbnail" class="input"></div>
<div class="field"><label>Status</label><select name="status" class="select"><option value="draft">Draft</option><option value="published">Published</option></select></div>
<div class="field full"><label>Description</label><textarea name="description" class="textarea"></textarea></div>
<div class="field full"><label>Learning Objectives</label><textarea name="objectives" class="textarea"></textarea></div>
<div class="field full"><label>Requirements</label><textarea name="requirements" class="textarea"></textarea></div>
<div class="field full"><button class="btn btn-green" type="submit" id="saveBtn">Create Course</button> <button class="btn" type="button" id="cancelBtn" hidden>Cancel Edit</button></div>
</div></form>
<div class="card" style="margin-top:20px"><div class="card-body"><h2>All Courses</h2><div class="table-wrap"><table class="table"><thead><tr><th>Course</th><th>Category</th><th>Level</th><th>Status</th><th>Action</th></tr></thead><tbody id="adminCourseRows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></div></div>
</main></div><div id="toast" class="toast"></div>
<script type="module">
import "../js/firebase.js";
const API="https://cyber-world-university.onrender.com/api";
const form=document.getElementById("courseForm"), rows=document.getElementById("adminCourseRows");
const toast=m=>{const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)};
async function api(path, options={}) {
  const user=await window.CWU.currentUser();
  if(!user) throw new Error("Please sign in as an administrator.");
  const token=await user.getIdToken();
  const r=await fetch(API+path,{...options,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...(options.headers||{})}});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||"Request failed");
  return data;
}
function reset(){form.reset();form.id.value="";form.instructor.value="CWU Academy";form.price.value="Free";form.status.value="draft";document.getElementById("saveBtn").textContent="Create Course";document.getElementById("modeLabel").textContent="Create Course";document.getElementById("cancelBtn").hidden=true}
function edit(c){for(const [k,v] of Object.entries(c)){const el=form.elements[k];if(el)el.value=v??""}form.id.value=c.id;document.getElementById("saveBtn").textContent="Update Course";document.getElementById("modeLabel").textContent="Edit Course";document.getElementById("cancelBtn").hidden=false;scrollTo({top:0,behavior:"smooth"})}
function render(list){rows.innerHTML=list.length?list.map(c=>`<tr><td><strong>${c.title||""}</strong></td><td>${c.category||""}</td><td>${c.level||""}</td><td>${c.status||"draft"}</td><td><button class="btn" data-edit="${c.id}">Edit</button> <button class="btn btn-danger" data-delete="${c.id}">Delete</button></td></tr>`).join(""):'<tr><td colspan="5">No courses yet.</td></tr>';window.courseCache=Object.fromEntries(list.map(c=>[c.id,c]))}
async function load(){try{const d=await api("/admin/courses");render(d.courses||[])}catch(e){toast(e.message)}}
form.addEventListener("submit",async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));delete data.id;data.durationMinutes=Number(data.durationMinutes||0);try{const id=form.id.value;await api(id?"/admin/courses/"+id:"/admin/courses",{method:id?"PUT":"POST",body:JSON.stringify(data)});toast(id?"Course updated":"Course created");reset();load()}catch(e){toast(e.message)}});
document.getElementById("cancelBtn").onclick=reset;
rows.addEventListener("click",async e=>{const editId=e.target.dataset.edit, deleteId=e.target.dataset.delete;if(editId){edit(window.courseCache[editId])}if(deleteId&&confirm("Delete this course?")){try{await api("/admin/courses/"+deleteId,{method:"DELETE"});toast("Course deleted");load()}catch(err){toast(err.message)}}});
document.getElementById("logoutBtn").onclick=async()=>{await window.CWU.logout();location.href="../login.html"};
const user=await window.CWU.currentUser();if(!user){location.href="../login.html?redirect=admin/courses"}else{const p=await window.CWU.userProfile();if(!p||p.role!=="admin"){location.href="../dashboard.html"}else load()}
</script>
</body></html>
