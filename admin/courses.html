<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses | CWU Admin</title><link rel="stylesheet" href="../css/style.css"></head><body ><header class="navbar"><a class="logo" href="../index.html"><span class="logo-mark">⌬</span><span><strong>Cyber World</strong><small>ADMIN PANEL</small></span></a><div class="nav-actions"><a class="btn" href="../index.html">Public Site</a><button class="btn btn-danger" onclick="logout()">Logout</button></div></header><div class="admin-shell"><aside class="admin-sidebar"><b>ADMINISTRATION</b><a href="index.html">Dashboard</a><a href="courses.html">Courses</a><a href="videos.html">Videos</a><a href="materials.html">Materials</a><a href="questions.html">Question Bank</a><a href="quizzes.html">Quizzes</a><a href="exams.html">Examinations</a><a href="certificates.html">Certificates</a><a href="advertisements.html">Advertisements</a><a href="students.html">Students</a><a href="settings.html">Website Content</a></aside><main class="admin-main"><div class="admin-top"><h1>Course Management</h1></div><form id="courseForm" class="card card-body"><div class="form-grid"><div class="field"><label>Course Name</label><input name="title" class="input" required></div><div class="field"><label>Category</label><input name="category" class="input" required></div><div class="field"><label>Level</label><select name="level" class="select"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div class="field"><label>Instructor</label><input name="instructor" class="input" value="CWU Academy"></div><div class="field"><label>Duration</label><input name="duration" class="input" value="6 Weeks"></div><div class="field"><label>Lessons</label><input name="lessons" class="input" type="number" value="10"></div><div class="field"><label>Quizzes</label><input name="quizzes" class="input" type="number" value="2"></div><div class="field"><label>Phases</label><input name="phases" class="input" type="number" value="3"></div><div class="field"><label>Price</label><input name="price" class="input" value="Free"></div><div class="field"><label>Status</label><select name="status" class="select"><option>Draft</option><option>Published</option></select></div><div class="field full"><label>Description</label><textarea name="description" class="textarea"></textarea></div><div class="field full"><label>Learning Objectives</label><textarea name="objectives" class="textarea"></textarea></div><div class="field full"><label>Requirements</label><textarea name="requirements" class="textarea"></textarea></div><div class="field full"><button class="btn btn-green">Create Course</button></div></div></form><div class="card" style="margin-top:20px"><div class="card-body"><h2>All Courses</h2><div class="table-wrap"><table class="table"><thead><tr><th>Course</th><th>Category</th><th>Lessons</th><th>Status</th><th>Action</th></tr></thead><tbody id="adminCourseRows"></tbody></table></div></div></div></main></div><div id="toast" class="toast"></div><script src="../js/app.js"></script></body></html>
