<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advertisements | CWU Admin</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="navbar"><a class="logo" href="../index.html"><span class="logo-mark">⌬</span><span><strong>Cyber World</strong><small>ADMIN PANEL</small></span></a><div class="nav-actions"><a class="btn" href="../index.html">Public Site</a><button class="btn btn-danger" id="logout">Logout</button></div></header>
<div class="admin-shell"><aside class="admin-sidebar"><a href="index.html">Dashboard</a><a href="courses.html">Courses</a><a href="videos.html">Videos</a><a href="materials.html">Materials</a><a href="questions.html">Questions</a><a href="quizzes.html">Quizzes</a><a href="exams.html">Exams</a><a href="certificates.html">Certificates</a><a href="advertisements.html">Ads</a><a href="students.html">Students</a><a href="settings.html">Settings</a></aside>
<main class="admin-main"><h1>Advertisement Banner Management</h1><form id="adForm" class="card card-body"><div class="form-grid"><div class="field"><label>Title</label><input name="title" class="input" required></div><div class="field"><label>Description</label><input name="description" class="input"></div><div class="field"><label>Button</label><input name="button" class="input" value="Learn More"></div><div class="field"><label>URL</label><input name="url" class="input" value="courses.html"></div><div class="field"><label>Status</label><select name="enabled" class="input"><option value="true">Enabled</option><option value="false">Disabled</option></select></div><div class="field full"><button class="btn btn-green">Create Advertisement</button></div></div></form>
<div class="card card-body" style="margin-top:20px"><div id="message" class="muted"></div><div class="table-wrap"><table class="table"><thead><tr><th>Title</th><th>URL</th><th>Status</th><th>Action</th></tr></thead><tbody id="adRows"></tbody></table></div></div></main></div><div id="toast" class="toast"></div>
<script type="module">
import "../js/firebase.js";
const API=window.CWU.apiBase, rows=document.getElementById("adRows"), msg=document.getElementById("message"); let ads=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function api(path,opt={}){const u=await window.CWU.currentUser();if(!u)throw Error("Admin login required");const token=await u.getIdToken();const r=await fetch(API+path,{...opt,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d;}
function render(){rows.innerHTML=ads.map(a=>`<tr><td>${esc(a.title)}</td><td>${esc(a.url)}</td><td>${a.enabled?"Enabled":"Disabled"}</td><td><button class="btn" data-id="${esc(a.id)}" data-action="toggle">${a.enabled?"Disable":"Enable"}</button> <button class="btn btn-danger" data-id="${esc(a.id)}" data-action="delete">Delete</button></td></tr>`).join("")||'<tr><td colspan="4">No advertisements found.</td></tr>';}
async function load(){try{const d=await api("/admin/advertisements");ads=d.advertisements||[];msg.textContent=ads.length+" advertisement"+(ads.length===1?"":"s");render();}catch(e){msg.textContent=e.message;}}
document.getElementById("adForm").addEventListener("submit",async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.currentTarget));x.enabled=x.enabled==="true";await api("/admin/advertisements",{method:"POST",body:JSON.stringify(x)});e.currentTarget.reset();await load();}catch(err){msg.textContent=err.message;}});
rows.addEventListener("click",async e=>{const b=e.target.closest("button[data-id]");if(!b)return;const a=ads.find(x=>x.id===b.dataset.id);if(!a)return;try{if(b.dataset.action==="delete")await api("/admin/advertisements/"+encodeURIComponent(a.id),{method:"DELETE"});else await api("/admin/advertisements/"+encodeURIComponent(a.id),{method:"PUT",body:JSON.stringify({...a,enabled:!a.enabled})});await load();}catch(err){msg.textContent=err.message;}});
document.getElementById("logout").onclick=async()=>{await window.CWU.logout();location.href="../login.html"};
const u=await window.CWU.currentUser();if(!u)location.href="../login.html?redirect=admin/advertisements";else{const p=await window.CWU.userProfile();if(!p||p.role!=="admin")location.href="../dashboard.html";else load();}
</script></body></html>
