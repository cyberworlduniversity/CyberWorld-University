<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Material Management | CWU Admin</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="navbar"><a class="logo" href="../index.html"><span class="logo-mark">⌬</span><span><strong>Cyber World</strong><small>ADMIN PANEL</small></span></a><div class="nav-actions"><a class="btn" href="courses.html">Courses</a><button class="btn btn-danger" id="logout">Logout</button></div></header><div class="admin-shell"><aside class="admin-sidebar"><a href="index.html">Dashboard</a><a href="courses.html">Courses</a><a href="videos.html">Videos</a><a href="materials.html">Materials</a><a href="questions.html">Questions</a><a href="quizzes.html">Quizzes</a><a href="exams.html">Exams</a><a href="certificates.html">Certificates</a><a href="advertisements.html">Ads</a><a href="students.html">Students</a></aside><main class="admin-main"><h1>Study Material Management</h1><p class="muted">Secure admin management for materials content.</p><div class="card card-body"><form id="form" class="form-grid"><div class="field"><label>Lesson ID</label><input name="lessonId" class="input" required></div><div class="field"><label>Title</label><input name="title" class="input" required></div><div class="field"><label>Order</label><input name="sortOrder" class="input" type="number" value="1" min="1"></div><div class="field"><label>Status</label><select name="status" class="select"><option value="draft">Draft</option><option value="published">Published</option></select></div><div class="field"><label>Material URL</label><input name="materialUrl" class="input" type="url" required></div><div class="field"><label>File Type</label><select name="fileType" class="select"><option>PDF</option><option>DOC</option><option>DOCX</option><option>PPT</option><option>PPTX</option><option>TXT</option><option>ZIP</option></select></div><div class="field full"><label>Description</label><textarea name="description" class="textarea"></textarea></div><div class="field"><button class="btn btn-green">Create</button></div></form></div><div class="card" style="margin-top:20px"><div class="card-body"><h2>Items for Lesson</h2><input id="loadLesson" class="input" placeholder="Enter lesson ID, then press Load"><button id="load" class="btn">Load</button><div class="table-wrap"><table class="table"><thead><tr><th>Title</th><th>Status</th><th>Order</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main></div><div id="toast" class="toast"></div><script type="module">import "../js/firebase.js";const API="https://cyberworld-university.onrender.com/api";const kind="materials";const form=document.getElementById("form"),rows=document.getElementById("rows"),toast=m=>{const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)};async function api(path,opt={}){const u=await window.CWU.currentUser();if(!u)throw Error("Admin login required");const t=await u.getIdToken();const r=await fetch(API+path,{...opt,headers:{"Content-Type":"application/json",Authorization:"Bearer "+t}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}async function load(id){try{const d=await api("/admin/lessons/"+id+"/"+kind);const list=d[kind]||[];rows.innerHTML=list.map(x=>`<tr><td>${x.title}</td><td>${x.status}</td><td>${x.sortOrder}</td><td><button class="btn btn-danger" data-id="${x.id}">Delete</button></td></tr>`).join("")||'<tr><td colspan="4">No items.</td></tr>'}catch(e){toast(e.message)}}form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));d.sortOrder=Number(d.sortOrder);if(d.durationMinutes)d.durationMinutes=Number(d.durationMinutes);try{await api("/admin/"+kind,{method:"POST",body:JSON.stringify(d)});toast("Created");load(d.lessonId);form.reset();form.status.value="draft";form.sortOrder.value=1}catch(e){toast(e.message)}};document.getElementById("load").onclick=()=>{const id=document.getElementById("loadLesson").value.trim();if(id)load(id)};rows.onclick=async e=>{if(e.target.dataset.id&&confirm("Delete this item?")){try{await api("/admin/"+kind+"/"+e.target.dataset.id,{method:"DELETE"});toast("Deleted");const id=document.getElementById("loadLesson").value.trim();load(id)}catch(x){toast(x.message)}}};document.getElementById("logout").onclick=async()=>{await window.CWU.logout();location.href="../login.html"};const u=await window.CWU.currentUser();if(!u)location.href="../login.html?redirect=admin/materials";else{const p=await window.CWU.userProfile();if(!p||p.role!=="admin")location.href="../dashboard.html"}</script></body></html>
