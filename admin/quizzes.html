<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizzes | CWU Admin</title><link rel="stylesheet" href="../css/style.css"></head><body data-admin-table="quizzes"><header class="navbar"><a class="logo" href="../index.html"><span class="logo-mark">⌬</span><span><strong>Cyber World</strong><small>ADMIN PANEL</small></span></a><a class="btn" href="../index.html">Public Site</a></header><div class="admin-shell"><aside class="admin-sidebar"><a href="index.html">Dashboard</a><a href="courses.html">Courses</a><a href="videos.html">Videos</a><a href="materials.html">Materials</a><a href="questions.html">Questions</a><a href="quizzes.html">Quizzes</a><a href="exams.html">Exams</a><a href="certificates.html">Certificates</a><a href="advertisements.html">Ads</a><a href="students.html">Students</a><a href="settings.html">Settings</a></aside><main class="admin-main"><h1>Quiz & Question Bank</h1><p class="muted">Create quizzes and manage questions.</p><div class="card card-body"><form id="quizForm" class="form-grid"><div class="field"><label>Course ID</label><input name="courseId" class="input" required></div><div class="field"><label>Quiz Title</label><input name="title" class="input" required></div><div class="field"><label>Duration</label><input name="durationMinutes" type="number" class="input" value="10"></div><div class="field"><label>Passing %</label><input name="passingScore" type="number" class="input" value="60"></div><div class="field"><label>Status</label><select name="status" class="select"><option>draft</option><option>published</option></select></div><div class="field full"><label>Description</label><textarea name="description" class="textarea"></textarea></div><div class="field"><button class="btn btn-green">Create Quiz</button></div></form></div><div class="card card-body" style="margin-top:20px"><form id="qForm" class="form-grid"><div class="field"><label>Quiz ID</label><input name="quizId" class="input" required></div><div class="field full"><label>Question</label><textarea name="question" class="textarea" required></textarea></div><div class="field"><label>Option A</label><input name="a" class="input" required></div><div class="field"><label>Option B</label><input name="b" class="input" required></div><div class="field"><label>Option C</label><input name="c" class="input"></div><div class="field"><label>Option D</label><input name="d" class="input"></div><div class="field"><label>Correct</label><select name="correctIndex" class="select"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="field"><label>Points</label><input name="points" type="number" class="input" value="1"></div><div class="field"><button class="btn btn-green">Add Question</button></div></form></div><div class="card card-body" style="margin-top:20px"><input id="quizId" class="input" placeholder="Quiz ID"><button id="load" class="btn">Load Questions</button><div class="table-wrap"><table class="table"><tbody id="rows"></tbody></table></div></div></main></div><script src="../js/app.js"></script></body></html>
