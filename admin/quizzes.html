<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizzes | CWU Admin</title><link rel="stylesheet" href="../css/style.css"></head><body data-admin-table="quizzes"><header class="navbar"><a class="logo" href="../index.html"><span class="logo-mark">⌬</span><span><strong>Cyber World</strong><small>ADMIN PANEL</small></span></a><a class="btn" href="../index.html">Public Site</a></header><div class="admin-shell"><aside class="admin-sidebar"><a href="index.html">Dashboard</a><a href="courses.html">Courses</a><a href="videos.html">Videos</a><a href="materials.html">Materials</a><a href="questions.html">Questions</a><a href="quizzes.html">Quizzes</a><a href="exams.html">Exams</a><a href="certificates.html">Certificates</a><a href="advertisements.html">Ads</a><a href="students.html">Students</a><a href="settings.html">Settings</a></aside><main class="admin-main"><h1>Quiz & Question Bank</h1><p class="muted">Create quizzes and manage questions.</p><div class="card card-body"><form id="quizForm" class="form-grid"><div class="field"><label>Course ID</label><input name="courseId" class="input" required></div><div class="field"><label>Quiz Title</label><input name="title" class="input" required></div><div class="field"><label>Duration</label><input name="durationMinutes" type="number" class="input" value="10"></div><div class="field"><label>Passing %</label><input name="passingScore" type="number" class="input" value="60"></div><div class="field"><label>Status</label><select name="status" class="select"><option>draft</option><option>published</option></select></div><div class="field full"><label>Description</label><textarea name="description" class="textarea"></textarea></div><div class="field"><button class="btn btn-green">Create Quiz</button></div></form></div><div class="card card-body" style="margin-top:20px"><form id="qForm" class="form-grid"><div class="field"><label>Quiz ID</label><input name="quizId" class="input" required></div><div class="field full"><label>Question</label><textarea name="question" class="textarea" required></textarea></div><div class="field"><label>Option A</label><input name="a" class="input" required></div><div class="field"><label>Option B</label><input name="b" class="input" required></div><div class="field"><label>Option C</label><input name="c" class="input"></div><div class="field"><label>Option D</label><input name="d" class="input"></div><div class="field"><label>Correct</label><select name="correctIndex" class="select"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="field"><label>Points</label><input name="points" type="number" class="input" value="1"></div><div class="field"><button class="btn btn-green">Add Question</button></div></form></div><div class="card card-body" style="margin-top:20px"><input id="quizId" class="input" placeholder="Quiz ID"><button id="load" class="btn">Load Questions</button><div class="table-wrap"><table class="table"><tbody id="rows"></tbody></table></div></div></main></div><script type="module">
import "../js/firebase.js";
const $=id=>document.getElementById(id), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let user=null,quizzes=[];
async function api(path,opt={}){const token=await user.getIdToken();const r=await fetch(window.CWU.apiBase+path,{...opt,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function loadQuizzes(){const d=await api("/admin/quizzes");quizzes=d.quizzes||[];renderQuizzes();}
function renderQuizzes(){$("quizId").value="";$("rows").innerHTML=quizzes.map(q=>'<tr><td>'+esc(q.title)+'</td><td>'+esc(q.courseId)+'</td><td>'+q.durationMinutes+' min</td><td>'+q.passingScore+'%</td><td>'+esc(q.status)+'</td><td><button class="btn" data-select="'+esc(q.id)+'">Manage</button></td></tr>').join("")||'<tr><td colspan="6">No quizzes found.</td></tr>'}
async function loadQuestions(id){$("quizId").value=id;const d=await api("/admin/quizzes/"+encodeURIComponent(id)+"/questions");const qs=d.questions||[];$("rows").innerHTML=(quizzes.find(q=>q.id===id)?'<tr><td colspan="6"><strong>'+esc(quizzes.find(q=>q.id===id).title)+'</strong></td></tr>':"")+(qs.map(q=>'<tr><td colspan="2">'+esc(q.question)+'</td><td>'+esc((q.options||[]).join(" | "))+'</td><td>'+String.fromCharCode(65+Number(q.correctIndex||0))+'</td><td>'+q.points+'</td><td><button class="btn btn-danger" data-delete="'+esc(q.id)+'">Delete</button></td></tr>').join("")||'<tr><td colspan="6">No questions found.</td></tr>')}
$("quizForm").onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.currentTarget));x.durationMinutes=Number(x.durationMinutes);x.passingScore=Number(x.passingScore);const d=await api("/admin/quizzes",{method:"POST",body:JSON.stringify(x)});e.currentTarget.reset();$("quizId").value=d.quiz.id;await loadQuizzes();await loadQuestions(d.quiz.id)}catch(e){alert(e.message)}};
$("qForm").onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.currentTarget));x.options=[x.a,x.b,x.c,x.d].map(v=>String(v||"").trim()).filter(Boolean);x.correctIndex=Number(x.correctIndex);x.points=Number(x.points);delete x.a;delete x.b;delete x.c;delete x.d;await api("/admin/questions",{method:"POST",body:JSON.stringify(x)});e.currentTarget.reset();await loadQuestions(x.quizId)}catch(e){alert(e.message)}};
$("load").onclick=()=>loadQuestions($("quizId").value).catch(e=>alert(e.message));
$("rows").onclick=e=>{const b=e.target.closest("button[data-select],button[data-delete]");if(!b)return;if(b.dataset.select)loadQuestions(b.dataset.select).catch(x=>alert(x.message));if(b.dataset.delete)api("/admin/questions/"+encodeURIComponent(b.dataset.delete),{method:"DELETE"}).then(()=>loadQuestions($("quizId").value)).catch(x=>alert(x.message))};
user=await window.CWU.currentUser();if(!user)location.href="../login.html?redirect=admin/quizzes";else{const p=await window.CWU.userProfile(user.uid);if(!p||p.role!=="admin")location.href="../dashboard.html";else loadQuizzes().catch(e=>alert(e.message))}
</script></body></html>
