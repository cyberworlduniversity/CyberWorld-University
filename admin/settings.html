<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | CWU Admin</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="navbar"><a class="logo" href="../index.html"><span class="logo-mark">⌬</span><span><strong>Cyber World</strong><small>ADMIN PANEL</small></span></a><div class="nav-actions"><a class="btn" href="../index.html">Public Site</a><button class="btn btn-danger" id="logout">Logout</button></div></header>
<div class="admin-shell"><aside class="admin-sidebar"><a href="index.html">Dashboard</a><a href="courses.html">Courses</a><a href="videos.html">Videos</a><a href="materials.html">Materials</a><a href="questions.html">Questions</a><a href="quizzes.html">Quizzes</a><a href="exams.html">Exams</a><a href="certificates.html">Certificates</a><a href="advertisements.html">Ads</a><a href="students.html">Students</a><a href="settings.html">Settings</a></aside>
<main class="admin-main"><h1>Website Content & Settings</h1><p class="muted">Changes are stored in Firebase Firestore.</p><form id="settingsForm" class="card card-body"><div class="field"><label>Homepage title</label><input id="homepageTitle" name="homepageTitle" class="input" required></div><div class="field"><label>Hero text</label><textarea id="heroText" name="heroText" class="textarea" required></textarea></div><div class="field"><label>Contact Email</label><input id="contactEmail" name="contactEmail" type="email" class="input"></div><button class="btn btn-green" type="submit">Save Content</button><div id="message" class="muted" style="margin-top:12px"></div></form></main></div><div id="toast" class="toast"></div>
<script type="module">
import "../js/firebase.js";
const API=window.CWU.apiBase, form=document.getElementById("settingsForm"), message=document.getElementById("message");
async function api(path,opt={}){const u=await window.CWU.currentUser();if(!u)throw Error("Admin login required");const token=await u.getIdToken();const r=await fetch(API+path,{...opt,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d;}
async function load(){try{message.textContent="Loading…";const d=await api("/admin/settings");const s=d.settings||{},c=d.content||{};form.homepageTitle.value=c.homepageTitle||"Learn Cybersecurity. Build Your Future.";form.heroText.value=c.heroText||"Practical cybersecurity education, structured learning paths, quizzes and certificates for students.";form.contactEmail.value=s.contactEmail||"";message.textContent="Loaded from Firestore.";}catch(e){message.textContent=e.message;}}
form.addEventListener("submit",async e=>{e.preventDefault();try{message.textContent="Saving…";const data=Object.fromEntries(new FormData(form));await api("/admin/settings",{method:"PUT",body:JSON.stringify(data)});message.textContent="Saved successfully to Firestore.";}catch(err){message.textContent=err.message;}});
document.getElementById("logout").onclick=async()=>{await window.CWU.logout();location.href="../login.html"};
const u=await window.CWU.currentUser();if(!u)location.href="../login.html?redirect=admin/settings";else{const p=await window.CWU.userProfile();if(!p||p.role!=="admin")location.href="../dashboard.html";else load();}
</script></body></html>
