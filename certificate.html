<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate | CWU</title><link rel="stylesheet" href="css/style.css"><style>
.certificate{max-width:900px;margin:40px auto;border:3px solid currentColor;padding:12px}.certificate-inner{border:1px solid currentColor;padding:60px 40px;text-align:center}.certificate h1{font-size:42px;margin:10px}.certificate .name{font-size:34px;margin:25px 0}.certificate .course{font-size:24px}.certificate .meta{margin-top:30px;display:flex;justify-content:space-around;gap:20px;flex-wrap:wrap}@media print{.navbar,.actions,footer{display:none!important}.certificate{margin:0;max-width:none}}
</style></head>
<body><header class="navbar"><a class="logo" href="index.html"><span class="logo-mark">⌬</span><span><strong>Cyber World</strong><small>University</small></span></a></header>
<main><div id="error" class="container notice" hidden></div><div id="certificate" class="certificate" hidden><div class="certificate-inner"><span class="eyebrow">CYBER WORLD UNIVERSITY</span><h1>Certificate of Completion</h1><p>This certifies that</p><div id="name" class="name"></div><p>has successfully completed the course</p><div id="course" class="course"></div><div class="meta"><div><strong>Certificate No.</strong><br><span id="number"></span></div><div><strong>Score</strong><br><span id="score"></span></div><div><strong>Issued</strong><br><span id="issued"></span></div></div><p style="margin-top:45px">Verified Certificate • Cyber World University</p></div></div><div class="container actions center"><button class="btn btn-primary" onclick="print()">Print / Save as PDF</button><a class="btn" href="certificates.html">Back to Certificates</a></div></main>
<script>
const n=new URLSearchParams(location.search).get("number"),$=id=>document.getElementById(id);
(async()=>{if(!n){$("error").hidden=false;$("error").textContent="Certificate number is missing.";return}try{const r=await fetch("https://cyberworlduniversity.onrender.com/api/certificates/"+encodeURIComponent(n)),d=await r.json();if(!r.ok||!d.valid)throw new Error("Certificate not found.");const c=d.certificate;$("name").textContent=c.studentName||"CWU Student";$("course").textContent=c.courseTitle||"";$("number").textContent=c.certificateNumber||n;$("score").textContent=(c.score??"")+"%";$("issued").textContent=c.issuedAt&&c.issuedAt._seconds?new Date(c.issuedAt._seconds*1000).toLocaleDateString(): "Issued";$("certificate").hidden=false}catch(e){$("error").hidden=false;$("error").textContent=e.message}})();
</script></body></html>
